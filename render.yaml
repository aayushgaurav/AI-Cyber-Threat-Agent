
services:
  - type: web
    name: ai-cyber-threat-agent-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: threat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/threats.db
      - key: CATALOG_PATH
        value: /var/data/vulnerabilities.json
